---
# Prometheus + Grafana on the monitoring server (the Jenkins host).
# Prometheus: versioned tarball + templated config + systemd unit.
# Grafana: apt repo, provisioned datasource, dashboard and alert.

# --- Prometheus --------------------------------------------------------------

- name: Create prometheus system user
  ansible.builtin.user:
    name: "{{ monitoring_prometheus_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ monitoring_prometheus_user }}"
    group: "{{ monitoring_prometheus_user }}"
    mode: "0755"
  loop:
    - /etc/prometheus
    - /etc/prometheus/rules
    - /var/lib/prometheus

- name: Download and unpack Prometheus
  ansible.builtin.unarchive:
    src: "{{ monitoring_prometheus_url }}"
    dest: /opt
    remote_src: true
    creates: "/opt/prometheus-{{ monitoring_prometheus_version }}.linux-amd64/prometheus"

- name: Install Prometheus binaries
  ansible.builtin.copy:
    src: "/opt/prometheus-{{ monitoring_prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop:
    - prometheus
    - promtool
  notify: Restart prometheus

- name: Write Prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: "{{ monitoring_prometheus_user }}"
    group: "{{ monitoring_prometheus_user }}"
    mode: "0644"
    validate: /usr/local/bin/promtool check config %s
  notify: Reload prometheus

- name: Write Prometheus alert rules
  ansible.builtin.template:
    src: alerts.yml.j2
    dest: /etc/prometheus/rules/crra.yml
    owner: "{{ monitoring_prometheus_user }}"
    group: "{{ monitoring_prometheus_user }}"
    mode: "0644"
    validate: /usr/local/bin/promtool check rules %s
  notify: Reload prometheus

- name: Install Prometheus service unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart prometheus

- name: Enable and start Prometheus
  ansible.builtin.systemd:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true

# --- Grafana -----------------------------------------------------------------

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add Grafana apt signing key (dearmored)
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      curl -fsSL {{ monitoring_grafana_repo_key_url }} | gpg --dearmor -o {{ monitoring_grafana_keyring }}
    creates: "{{ monitoring_grafana_keyring }}"
    executable: /bin/bash

- name: Add Grafana apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/grafana.list
    content: "{{ monitoring_grafana_repo }}\n"
    owner: root
    group: root
    mode: "0644"
  register: monitoring_grafana_repo_file

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: "{{ monitoring_grafana_repo_file.changed | bool }}"

- name: Configure Grafana
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: root
    group: grafana
    mode: "0640"
  no_log: true # contains the vaulted admin password
  notify: Restart grafana

- name: Provision Prometheus datasource
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

- name: Provision dashboard loader
  ansible.builtin.template:
    src: grafana-dashboards.yml.j2
    dest: /etc/grafana/provisioning/dashboards/crra.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

- name: Create dashboard directory
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"

- name: Install CRRA dashboard
  ansible.builtin.copy:
    src: crra-overview.json
    dest: /var/lib/grafana/dashboards/crra-overview.json
    owner: grafana
    group: grafana
    mode: "0644"

- name: Enable and start Grafana
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started
    daemon_reload: true
