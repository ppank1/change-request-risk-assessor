[defaults]
inventory = inventories/dev/aws_ec2.yml
deprecation_warnings = False
roles_path = roles
remote_user = ubuntu
private_key_file = ~/.ssh/crra-key.pem
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml
forks = 10
timeout = 30

[inventory]
enable_plugins = amazon.aws.aws_ec2, yaml, ini
cache = True
cache_plugin = jsonfile
cache_connection = ~/.ansible/inventory_cache
cache_timeout = 300

[ssh_connection]
pipelining = True
# SSH is tunnelled through SSM Session Manager: %h is the EC2 instance ID
# (set by the inventory's compose), so no port 22 has to be open anywhere.
ssh_args = -F /dev/null -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ProxyCommand="aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p --region us-west-2"

[privilege_escalation]
become = True
become_method = sudo
