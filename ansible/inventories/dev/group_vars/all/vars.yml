---
# Static, non-secret configuration for every CRRA host.
# Secrets live in vault.yml (ansible-vault encrypted) and are referenced here
# by name so a plain-text grep of this file never shows a secret value.

project: crra
environment_name: dev
aws_region: us-west-2

# Elastic IPs are the only stable public addresses; read from Terraform output
# and set here once. Never a raw auto-assigned public IP.
jenkins_public_ip: "44.246.87.255"
k3s_public_ip: "34.217.248.68"
jenkins_url: "http://{{ jenkins_public_ip }}:8080/"

# Ports
jenkins_port: 8080
k3s_api_port: 6443
monitoring_node_exporter_port: 9100
prometheus_port: 9090
grafana_port: 3000

# Secrets: SSM Parameter Store SecureStrings, created once by an operator
# (docs/runbook.md "Secrets"). Resolved on the controller at run time with
# its own AWS identity -- the Jenkins host's instance role in the pipeline,
# the operator's credentials from a devdesk -- so no secret is in this repo,
# in a vault file, or in a Jenkins credential. Terraform grants the CI role
# read access to exactly these parameter ARNs (terraform/environments/dev/secrets.tf).
crra_ssm_secret_prefix: "/{{ project }}/{{ environment_name }}"
grafana_admin_password: "{{ lookup('amazon.aws.aws_ssm', crra_ssm_secret_prefix ~ '/grafana/admin_password', region=aws_region) }}"
crra_api_token: "{{ lookup('amazon.aws.aws_ssm', crra_ssm_secret_prefix ~ '/app/api_token', region=aws_region) }}"
