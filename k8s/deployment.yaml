apiVersion: apps/v1
kind: Deployment
metadata:
  name: crra
  namespace: crra-dev
  labels:
    app: crra
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: crra
  template:
    metadata:
      labels:
        app: crra
    spec:
      containers:
        - name: crra
          # Tag is a placeholder: the pipeline pins the exact commit-SHA image
          # (docker.io/<hub-user>/crra:<sha>) with `kubectl set image` on every
          # deploy. Never ':latest'.
          image: docker.io/crra:set-by-pipeline
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: crra-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
