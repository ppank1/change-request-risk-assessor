apiVersion: v1
kind: ConfigMap
metadata:
  name: crra-config
  namespace: crra-dev
data:
  SCORING_STRATEGY: "simple"
  ENABLE_BLAST_RADIUS_CHECK: "true"
  ENABLE_TIME_WINDOW_CHECK: "true"
  ENABLE_ROLLBACK_CHECK: "true"
  HIGH_RISK_THRESHOLD: "60"
  CRITICAL_RISK_THRESHOLD: "80"
  LOG_LEVEL: "INFO"
